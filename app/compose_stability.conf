// Compose 编译器的稳定性声明。
//
// 每行一个全限定类名。写在这里的类型，编译器会当成"不可变"处理，
// 于是包含它们的 data class 也能被推断成 stable，从而参与**重组跳过**。
//
// 判断标准只有一个：这个类型真的不可变吗？
//   —— 所有属性都是 val、且属性本身也不可变，才能写进来。
// 写错了不会有编译错误，只会让界面**该更新的时候不更新**。
//
// java.time 的这套值类型都是不可变的（所有字段 final，修改方法返回新实例），
// 但 Compose 编译器不认识它们，默认判成 unstable。
// 这个 App 里 CountdownEvent / CountdownInfo / AlmanacMark 全都含 LocalDate，
// 不声明的话它们三个连带下游所有 Composable 都跳过不了重组。

java.time.LocalDate
java.time.LocalDateTime
java.time.LocalTime
java.time.YearMonth
